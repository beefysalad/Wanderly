- name: Create PR from dev to prod
  env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    echo "Getting latest commit message from dev..."
    COMMIT_MESSAGE=$(git log -1 --pretty=%s)

    echo "Checking for existing PR from dev to prod..."
    existing_pr=$(gh pr list \
      --base prod \
      --head dev \
      --json number \
      --jq '.[].number' | head -n 1)

    if [ -n "$existing_pr" ]; then
      echo "PR #$existing_pr already exists. Skipping creation."
    else
      echo "Creating PR with commit message as title..."
      gh pr create \
        --base prod \
        --head dev \
        --title "$COMMIT_MESSAGE" \
        --body "Automated PR from dev to prod.\n\nCommit message:\n$COMMIT_MESSAGE" \
        || echo "No changes to merge or PR creation failed."
    fi
